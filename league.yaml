# ─────────────────────────────────────────────────────────────────────────────
# League configuration
#
# Mirrors the settings you can change in ESPN (League Settings → Basic /
# Roster / Scoring). Edit this file rather than touching the scripts.
#
# ⚠️  VERIFY THE MARKED FIELDS against your actual ESPN league before drafting.
#     Values marked [carried over] came from last season's hardcoded script.
#     Values marked [ESPN default] are ESPN's defaults and are a guess.
# ─────────────────────────────────────────────────────────────────────────────

league:
  name: ""                  # optional, cosmetic
  platform: espn
  season: 2026
  size: 12                  # [carried over] number of teams
  scoring_type: half_ppr    # standard | half_ppr | ppr — see scoring.receiving.reception

draft:
  type: snake               # snake | auction  (only snake is implemented)
  my_slot: 12               # [carried over] your pick position, 1..league.size
  reversal_round: null      # ESPN "3rd round reversal"; null = off

# ─────────────────────────────────────────────────────────────────────────────
# Roster — ESPN "Roster Settings" lineup slot counts.
# Set a slot to 0 if your league doesn't use it.
# ─────────────────────────────────────────────────────────────────────────────
roster:
  lineup_slots:
    QB: 1                   # [carried over]
    RB: 2                   # [carried over]
    WR: 2                   # [carried over]
    TE: 1                   # [carried over]
    FLEX: 2                 # [carried over] ⚠️ ESPN default is 1
    OP: 0                   # superflex / offensive player (QB-eligible flex)
    D/ST: 0                 # ⚠️ ESPN default is 1
    K: 0                    # ⚠️ ESPN default is 1
  flex_eligible: [RB, WR, TE]
  op_eligible: [QB, RB, WR, TE]
  bench: 5                  # [carried over] ⚠️ ESPN default is 7
  ir: 0                     # injured reserve slots; not drafted

# ─────────────────────────────────────────────────────────────────────────────
# Scoring — ESPN "Scoring Settings". Points per unit unless noted.
# Only the offensive categories feed the draft assistant today; kicking and
# defense are recorded here so the file is a complete picture of the league.
# ─────────────────────────────────────────────────────────────────────────────
scoring:
  passing:
    yards_per_point: 25     # ESPN expresses this as 1 pt per N yards
    touchdown: 4
    interception: -2
    two_point_conversion: 2
    bonus_300_yd: 0         # [ESPN default] off
    bonus_400_yd: 0

  rushing:
    yards_per_point: 10
    touchdown: 6
    two_point_conversion: 2
    bonus_100_yd: 0
    bonus_200_yd: 0

  receiving:
    reception: 0.5          # ⚠️ 0 = standard, 0.5 = half PPR, 1 = full PPR
    yards_per_point: 10
    touchdown: 6
    two_point_conversion: 2
    bonus_100_yd: 0
    bonus_200_yd: 0

  misc:
    fumble_lost: -2
    fumble_recovered_td: 6
    return_td: 6

  kicking:                  # [ESPN default] unused while roster.lineup_slots.K is 0
    pat_made: 1
    pat_missed: -1
    fg_0_39: 3
    fg_40_49: 4
    fg_50_plus: 5
    fg_missed: -1

  defense:                  # [ESPN default] unused while roster.lineup_slots["D/ST"] is 0
    sack: 1
    interception: 2
    fumble_recovery: 2
    safety: 2
    touchdown: 6
    blocked_kick: 2
    points_allowed:         # upper bound of each tier -> points
      0: 5
      6: 4
      13: 3
      17: 1
      27: 0
      34: -1
      45: -3
      99: -5

# ─────────────────────────────────────────────────────────────────────────────
# Draft assistant behaviour (not an ESPN setting)
# ─────────────────────────────────────────────────────────────────────────────
tool:
  positions: [QB, RB, WR, TE]   # positions the assistant ranks and suggests
  points_column: AVG            # column in the projection sheets to rank on
  suggestions: 10               # rows shown per pick
